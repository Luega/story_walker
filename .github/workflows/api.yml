# CI for the API (ADR-0012, ADR-0035, ADR-0036): build and test, never deploy. It runs when the API, the
# shared libraries it is built from, the tests or the package versions change.
name: API

on:
  # Called by ci.yml (ADR-0036), which decides from the changed files whether it runs.
  workflow_call:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # The test project references the API, which brings the shared libraries with it.
      - name: Build
        run: dotnet build tests/StoryWalker.Api.Tests/StoryWalker.Api.Tests.csproj --configuration Release

      # The integration tests start a real PostgreSQL through Testcontainers (ADR-0017); the hosted
      # runner already has Docker.
      - name: Test
        run: dotnet test tests/StoryWalker.Api.Tests/StoryWalker.Api.Tests.csproj --no-build --configuration Release
