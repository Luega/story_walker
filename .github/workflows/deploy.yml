# CD for prod (ADR-0035). On a push to main that touches what runs in Azure, or by hand: run the three
# CI workflows, then build and push both images to GitHub Container Registry, deploy the worker
# package, and apply Terraform with the new image tags. Both images are built on every run, so the
# apply always has both tags and can never fall back to the placeholder image.
#
# Rollback: run this workflow by hand on a branch or tag that points at the commit to go back to.
name: Deploy

on:
  push:
    branches: [main]
    paths:
      - apps/**
      - src/**
      - tests/**
      - iac/**
      - Directory.Packages.props
      - .github/workflows/**
  workflow_dispatch:

# One deploy at a time; a second waits instead of cancelling one halfway through an apply.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  api:
    uses: ./.github/workflows/api.yml

  worker:
    uses: ./.github/workflows/worker.yml

  ui:
    uses: ./.github/workflows/ui.yml

  deploy:
    needs: [api, worker, ui]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The OIDC subject is repo:<owner>/<repo>:environment:prod; the federated credential on Azure
    # trusts that and nothing else. The environment also holds the secrets below.
    environment: prod
    permissions:
      contents: read
      id-token: write # the OIDC token Azure exchanges for an access token
      packages: write # push the images, delete their old versions
    env:
      # Terraform's provider and its azurerm backend sign in with the same OIDC token.
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_IN_AUTOMATION: "true"
      TF_VAR_clerk_secret_key: ${{ secrets.CLERK_SECRET_KEY }}
      TF_VAR_ghcr_pull_token: ${{ secrets.GHCR_PULL_TOKEN }}
      # A JSON list, e.g. ["me@example.com"]; unset creates no budget.
      TF_VAR_budget_contact_emails: ${{ vars.BUDGET_CONTACT_EMAILS || '[]' }}
    defaults:
      run:
        working-directory: iac
    steps:
      - uses: actions/checkout@v4

      # Image names must be lowercase; the owner's login may not be.
      - name: Name the images
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          {
            echo "GHCR_OWNER=$owner"
            echo "API_IMAGE=ghcr.io/$owner/storywalker-api:$GITHUB_SHA"
            echo "UI_IMAGE=ghcr.io/$owner/storywalker-ui:$GITHUB_SHA"
          } >> "$GITHUB_ENV"

      # For the az CLI the worker deployment uses.
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false # plain stdout, so `terraform output -raw` can be captured

      - name: Terraform init
        run: terraform init -input=false -backend-config=environments/prod.backend.hcl

      # The UI image needs two values the infrastructure owns, and the worker deployment needs the
      # function app's name. They exist from the first, hand-run apply on (iac/README.md).
      - name: Read Terraform outputs
        id: tf
        run: |
          appinsights="$(terraform output -raw application_insights_connection_string)"
          echo "::add-mask::$appinsights"
          {
            echo "appinsights=$appinsights"
            echo "clerk_publishable_key=$(terraform output -raw clerk_publishable_key)"
            echo "function_app=$(terraform output -raw function_app_name)"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      # provenance: false keeps one package version per tag, so "keep the last five" means five
      # deployable images rather than images and their attestations.
      - name: Build and push the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          provenance: false
          tags: ${{ env.API_IMAGE }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      # NEXT_PUBLIC_* are inlined at `next build`, so they are build arguments of this image.
      - name: Build and push the UI image
        uses: docker/build-push-action@v6
        with:
          context: apps/ui
          push: true
          provenance: false
          tags: ${{ env.UI_IMAGE }}
          build-args: |
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ steps.tf.outputs.clerk_publishable_key }}
            NEXT_PUBLIC_APPLICATIONINSIGHTS_CONNECTION_STRING=${{ steps.tf.outputs.appinsights }}
          cache-from: type=gha,scope=ui
          cache-to: type=gha,scope=ui,mode=max

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish the worker
        working-directory: .
        run: dotnet publish apps/functions/StoryWalker.Functions.csproj --configuration Release --output publish/worker

      # Flex Consumption runs the package the action uploads to the app's deployment container.
      - name: Deploy the worker
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ steps.tf.outputs.function_app }}
          package: publish/worker
          sku: flexconsumption

      # Only the image tags change on an ordinary deploy, so Container Apps starts a new revision of
      # each app and moves traffic once its probe answers. Changes under iac/ are applied too.
      - name: Terraform apply
        run: |
          terraform apply -input=false -auto-approve \
            -var-file=environments/prod.tfvars \
            -var "api_image=$API_IMAGE" \
            -var "ui_image=$UI_IMAGE" \
            -var "ghcr_username=$GHCR_OWNER"

      - name: Keep the last five API images
        uses: actions/delete-package-versions@v5
        with:
          package-name: storywalker-api
          package-type: container
          min-versions-to-keep: 5

      - name: Keep the last five UI images
        uses: actions/delete-package-versions@v5
        with:
          package-name: storywalker-ui
          package-type: container
          min-versions-to-keep: 5
