# CI for the generation worker (ADR-0012, ADR-0035, ADR-0036): build, never deploy. The worker has no test
# project of its own; what it runs (renderer, image generators, image store) lives in src/, and the
# API workflow tests that on every change to src/ or tests/, so running the suite here too would only
# spend the same minutes twice.
name: Worker

on:
  # Called by ci.yml (ADR-0036), which decides from the changed files whether it runs.
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build the worker
        run: dotnet build apps/functions/StoryWalker.Functions.csproj --configuration Release
