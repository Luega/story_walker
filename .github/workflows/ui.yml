# CI for the UI (ADR-0012, ADR-0035): lint, test and build, never deploy. The UI shares no code with
# the .NET projects, so on a pull request only its own folder triggers it. The build needs no
# secrets: the Clerk key is inlined only into the image CD builds.
name: UI

on:
  # On main, deploy.yml calls this workflow before it deploys, so a push needs no run of its own.
  workflow_call:
  pull_request:
    paths:
      - apps/ui/**
      - .github/workflows/ui.yml

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/ui

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4

      # The same major as apps/ui/Dockerfile's NODE_VERSION.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/ui/package-lock.json

      - run: npm ci

      - run: npm run lint

      # The component tests run in a real Chromium driven by Playwright (vitest.config.mts), which the
      # runner does not have: install the version the locked playwright package expects, with the
      # system libraries it needs.
      - run: npx playwright install --with-deps chromium

      - run: npm test

      - run: npm run build
