services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: storywalker-postgres
    environment:
      POSTGRES_USER: storywalker
      POSTGRES_PASSWORD: storywalker
      POSTGRES_DB: storywalker
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storywalker -d storywalker"]
      interval: 5s
      timeout: 5s
      retries: 5

  # The API. Behind the "api" profile, mirroring the `functions` worker below: a plain
  # `docker compose up` starts the infrastructure only, and you run the API from the host
  # (`dotnet run --project apps/api`) where DefaultAzureCredential picks up your `az login` and
  # appsettings.Development.json already points at localhost for Postgres/Service Bus.
  # `docker compose --profile api up` runs it in-container instead — that path has no `az login`
  # to reuse (no `az` binary, non-root user), so it authenticates with the Foundry deployment key
  # from .env (see .env.example).
  api:
    build:
      context: .                      # monorepo root, so the Dockerfile can reach src/
      dockerfile: apps/api/Dockerfile
    container_name: storywalker-api
    profiles:
      - api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # Inside the compose network the DB is reached by service name, not localhost.
      # This env var overrides ConnectionStrings:Postgres from appsettings.
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=storywalker;Username=storywalker;Password=storywalker"
      # The agent backend: the Foundry chat deployment (ADR-0011). Foundry is a cloud endpoint, so
      # there is nothing to run on the compose network — only configuration. Overrides Foundry:*
      # from appsettings.
      Foundry__Endpoint: "${FOUNDRY_ENDPOINT:-}"
      Foundry__Deployment: "${FOUNDRY_DEPLOYMENT:-}"
      # The deployment key. Only this in-container path needs it: from the host the API borrows your
      # `az login`, and in Azure it will use a managed identity — neither stores a secret anywhere.
      Foundry__ApiKey: "${FOUNDRY_API_KEY:-}"
      # Publishes the authored brief to the Service Bus emulator (reached by service name). The
      # SharedAccessKey is the literal emulator placeholder; UseDevelopmentEmulator=true selects it.
      ServiceBus__ConnectionString: "Endpoint=sb://servicebus-emulator;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;"
      # Clerk session tokens are the API's credentials (ADR-0002). The authority is the instance
      # URL (JWKS is discovered from it); authorized parties is the comma-separated list of origins
      # allowed to obtain tokens for this API — the Next.js app in dev.
      Clerk__Authority: "${CLERK_AUTHORITY:-}"
      Clerk__AuthorizedParties: "${CLERK_AUTHORIZED_PARTIES:-http://localhost:3000}"
      # Telemetry to Application Insights (ADR-0023). Blank leaves it off, which is the default.
      APPLICATIONINSIGHTS_CONNECTION_STRING: "${APPLICATIONINSIGHTS_CONNECTION_STRING:-}"
    ports:
      - "5080:8080"                   # host 5080 -> container 8080
    depends_on:
      postgres:
        condition: service_healthy    # wait for the DB before migrating/seeding on startup
      servicebus-emulator:
        condition: service_started    # only publishes mid-conversation, so start ordering is enough

  # The Next.js UI, as the image Azure runs (apps/ui/Dockerfile). Behind the "ui" profile: day to
  # day you run `npm run dev` in apps/ui, which takes the same port. `docker compose --profile api
  # --profile ui up --build` runs both in containers, the UI calling the API by service name.
  ui:
    build:
      context: apps/ui                # the UI shares no code with the .NET projects
      dockerfile: Dockerfile
      args:
        # Inlined into the browser bundle at build time, so a build argument, not an env var.
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: "${CLERK_PUBLISHABLE_KEY:-}"
        NEXT_PUBLIC_APPLICATIONINSIGHTS_CONNECTION_STRING: "${APPLICATIONINSIGHTS_CONNECTION_STRING:-}"
    container_name: storywalker-ui
    profiles:
      - ui
    environment:
      # Server-side only: the proxy route forwards /api/* here (ADR-0021).
      API_URL: "http://api:8080"
      CLERK_SECRET_KEY: "${CLERK_SECRET_KEY:-}"
      APPLICATIONINSIGHTS_CONNECTION_STRING: "${APPLICATIONINSIGHTS_CONNECTION_STRING:-}"
    ports:
      - "3000:3000"                   # the origin CLERK_AUTHORIZED_PARTIES defaults to

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: storywalker-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@storywalker.app
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"               # desktop mode: no extra login page
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"  # skip the master-password prompt
    ports:
      - "5050:80"                     # browse at http://localhost:5050
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      # Pre-registers the "Story Walker (local)" connection (Host=postgres, service name).
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  # SQL Server backing store required by the Service Bus emulator (its only supported dependency).
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: storywalker-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-StoryWalker!Local1}"

  # Local Azure Service Bus (ADR-0003). Entities can't be created at runtime, so the ingestion queue
  # is declared up-front in docker/servicebus/Config.json. Port 5672 = AMQP, 5300 = management/health.
  servicebus-emulator:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
    container_name: storywalker-servicebus
    volumes:
      - ./docker/servicebus/Config.json:/ServiceBus_Emulator/ConfigFiles/Config.json:ro
    ports:
      - "5672:5672"                   # AMQP, for the API/worker when run locally against the emulator
      - "5300:5300"                   # management + /health endpoint
    environment:
      ACCEPT_EULA: "Y"
      SQL_SERVER: mssql               # reached by service name on the compose network
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-StoryWalker!Local1}"
    depends_on:
      - mssql

  # Azure Storage emulator: backs the Functions host runtime and stores the page images (ADR-0010).
  # --skipApiVersionCheck: the storage SDKs send a newer Storage API version than this Azurite build
  # whitelists; without the flag blob/queue/table calls 400.
  # --location /data: the image's default command passes `-l /data`, but overriding `command` drops
  # it, and Azurite then writes into its own install directory (/opt/azurite) — inside the
  # container, gone on every recreate. It must be restated for the volume below to hold anything.
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: storywalker-azurite
    command: azurite --skipApiVersionCheck --location /data --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0
    ports:
      - "10000:10000"                 # blob
      - "10001:10001"                 # queue
      - "10002:10002"                 # table
    volumes:
      # Page images persist across `docker compose down`. Without it the database kept ImageUrls that
      # 404ed after every restart. `docker compose down -v` still wipes it, together with postgres.
      - azurite-data:/data

  # Web UI for Azurite — the storage counterpart of pgAdmin. Browse blob containers (with image
  # previews), queues and tables at http://localhost:5055. Community project, MIT
  # (github.com/sebagomez/azurestorageexplorer); pinned rather than `latest` so an upstream change
  # cannot silently break the local setup. It runs server-side (Blazor Server), so it reaches Azurite
  # by service name. No authentication: local development only.
  storage-explorer:
    image: sebagomez/azurestorageexplorer:4.0.0
    container_name: storywalker-storage-explorer
    environment:
      # Logs straight in; the key is Azurite's well-known development key, not a secret.
      AZURE_STORAGE_CONNECTIONSTRING: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;TableEndpoint=http://azurite:10002/devstoreaccount1;"
    ports:
      - "5055:8080"                   # browse at http://localhost:5055
    depends_on:
      - azurite

  # Generation worker (ADR-0020): a Service Bus-triggered Functions host. Behind the "worker"
  # profile: `docker compose up` leaves it off so you can run/debug the worker locally against the
  # emulator without two consumers fighting over the queue; `docker compose --profile worker up`
  # runs it fully in-container.
  functions:
    build:
      context: .                      # monorepo root, so the Dockerfile can reach src/
      dockerfile: apps/functions/Dockerfile
    container_name: storywalker-functions
    environment:
      FUNCTIONS_WORKER_RUNTIME: dotnet-isolated
      # Azurite is on a different host than localhost here, so the full connection string form is
      # required (UseDevelopmentStorage=true only resolves to 127.0.0.1). The Functions host needs
      # AzureWebJobsStorage for any non-HTTP trigger, independently of what the function does.
      AzureWebJobsStorage: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;TableEndpoint=http://azurite:10002/devstoreaccount1;"
      ServiceBusConnection: "Endpoint=sb://servicebus-emulator;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;"
      # The activities write pages and read the story, so the worker needs the database too.
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=storywalker;Username=storywalker;Password=storywalker"
      # The Foundry image deployment (ADR-0011), and the API's chat deployment, which the worker
      # calls only to rewrite an illustration prompt the image model refused (ADR-0025).
      Foundry__Endpoint: "${FOUNDRY_ENDPOINT:-}"
      Foundry__Deployment: "${FOUNDRY_DEPLOYMENT:-}"
      Foundry__ImageDeployment: "${FOUNDRY_IMAGE_DEPLOYMENT:-}"
      Foundry__ApiKey: "${FOUNDRY_API_KEY:-}"
      # Page images (ADR-0010). Same azurite account as the Functions runtime, different container.
      Storage__ConnectionString: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;"
      Storage__Container: "story-images"
      # NOT derived from the upload URI: the worker uploads through http://azurite:10000, a hostname
      # that does not resolve outside the compose network. The URL we persist has to be the one a
      # browser on the host can open.
      Storage__PublicBaseUrl: "http://localhost:10000/devstoreaccount1"
      # Telemetry to Application Insights (ADR-0023), read by both the worker and the Functions
      # host (telemetryMode in host.json). Blank leaves it off.
      APPLICATIONINSIGHTS_CONNECTION_STRING: "${APPLICATIONINSIGHTS_CONNECTION_STRING:-}"
    depends_on:
      - servicebus-emulator
      - azurite
      - postgres
    profiles:
      - worker

volumes:
  postgres-data:
  pgadmin-data:
  azurite-data:
